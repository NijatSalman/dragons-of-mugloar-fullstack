spring:
  application:
    name: dragons-of-mugloar
  threads:
    virtual:
      enabled: true

server:
  port: 8080

mugloar:
  base-url: https://dragonsofmugloar.com/api/v2
  connect-timeout: 3s
  read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    com.company.dragonsofmugloar: INFO
