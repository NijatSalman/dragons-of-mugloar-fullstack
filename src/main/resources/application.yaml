spring:
  application:
    name: dragons-of-mugloar
  threads:
    virtual:
      enabled: true

server:
  port: 8080

spring.http.clients:
  connect-timeout: 3s
  read-timeout: 10s

game-api:
  base-url: https://dragonsofmugloar.com/api/v2

autoplay:
  recommended-min-chance: 0.55
  recommended-min-turns-left: 2
  low-lives: 2
  safe-chance: 0.8
  potion-item: hpot
  potion-min-gold: 50
  cheap-upgrade-min-gold: 150
  cheap-upgrades: [cs, gas, wax, tricks, wingpot]
  expensive-upgrade-min-gold: 350
  expensive-upgrades: [ch, rf, iron, mtrix, wingpotmax]
  max-turns: 500

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    com.company.dragonsofmugloar: INFO
