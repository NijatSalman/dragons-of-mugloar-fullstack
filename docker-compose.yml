services:
  app:
    build: .
    image: dragons-of-mugloar:local
    container_name: dragons-of-mugloar
    # Change the host port when 8080 is taken: APP_PORT=8090 docker compose up
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      GAME_API_BASE_URL: https://dragonsofmugloar.com/api/v2
    restart: unless-stopped
